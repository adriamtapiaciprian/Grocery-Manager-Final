<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="title">
    <h1>Grocery List Manager</h1>
        
    <input type="text" id="userInput" placeholder="Type groceries">
    <p id="displayText"></p>

    <button onClick="leftToPurchase()" id="leftToPurchaseButton">View unpurchased groceries</button>
    <button onClick="purchasedItems()" id="viewPurchasedButton">View purchased groceries</button>
    <button onClick="addGroceries()" id="addGroceryButton" class="addGrocery">Add groceries</button> 
    <ul class="groceryList"></ul>

    </div>
    
    


    <script src="main.js"></script>
</body>
</html>
